@if (showSavedToast) {
  <div class="site-toast" [class.site-toast-error]="toastType === 'error'" role="alert">
    <span class="site-toast-icon">
      <i class="fa-solid" [ngClass]="toastType === 'success' ? 'fa-check' : 'fa-circle-exclamation'"></i>
    </span>
    <span>{{ toastMessage }}</span>
  </div>
}

@if (title) {
  <div class="site-promo-bar">
    <a
      class="site-promo-inner"
      [routerLink]="['/listado-de-examenes']"
      (click)="closeMobileMenu()">
      <span class="site-promo-tag">Novedades</span>
      <span class="site-promo-text">{{ title }}</span>
      <i class="fa-solid fa-arrow-right"></i>
    </a>
  </div>
}

<header class="site-header" [class.site-header-menu-open]="isMobileMenuOpen">
  <div class="site-header-inner">
    <a class="site-brand" [routerLink]="['/']" (click)="closeMobileMenu()" aria-label="Ir a la página de inicio">
      <img ngSrc="logo.png" alt="Prepara Bombero" width="125" height="116" priority>
    </a>

    <div class="site-social-links" aria-label="Redes sociales">
      <a title="TikTok" href="https://www.tiktok.com/@preparabombero" target="_blank" rel="noopener" aria-label="TikTok">
        <i class="fab fa-tiktok"></i>
      </a>
      <a title="Instagram" href="https://www.instagram.com/preparabombero" target="_blank" rel="noopener" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a title="Telegram" href="https://t.me/+l1TvslhJrlNhYWI0" target="_blank" rel="noopener" aria-label="Telegram">
        <i class="fab fa-telegram"></i>
      </a>
    </div>

    <button
      type="button"
      class="site-mobile-toggle"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-controls="main-navigation"
      aria-label="Abrir menú de navegación">
      <i class="fa-solid" [ngClass]="isMobileMenuOpen ? 'fa-xmark' : 'fa-bars'"></i>
    </button>

    <div id="main-navigation" class="site-header-content">
      <nav class="site-main-nav" aria-label="Navegación principal">
        @if(isNotAuth) {
          <a
            class="site-nav-item"
            [routerLink]="['/']"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLinkActive="site-nav-item-active"
            (click)="closeMobileMenu()">
            <i class="fa-solid fa-house"></i>
            <span>Inicio</span>
          </a>
          <button type="button" class="site-nav-item" (click)="onExamsClick()">
            <i class="fa-solid fa-folder-open"></i>
            <span>Exámenes</span>
          </button>
        }

        @if(isAdmin || isUser) {
          <a
            class="site-nav-item"
            [routerLink]="['/']"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLinkActive="site-nav-item-active"
            (click)="closeMobileMenu()">
            <i class="fa-solid fa-house"></i>
            <span>Inicio</span>
          </a>
          <a
            class="site-nav-item"
            [routerLink]="['/examenes']"
            routerLinkActive="site-nav-item-active"
            (click)="closeMobileMenu()">
            <i class="fa-solid fa-folder-open"></i>
            <span>Exámenes</span>
          </a>
          <button
            type="button"
            class="site-nav-item"
            [class.site-nav-item-active]="isRouteActive('/preguntas-guardadas')"
            (click)="onSavedClick()">
            <i class="fa-regular fa-floppy-disk"></i>
            <span>Guardadas</span>
          </button>
          <a
            class="site-nav-item"
            [routerLink]="['/plan-estudio']"
            routerLinkActive="site-nav-item-active"
            (click)="closeMobileMenu()">
            <i class="fa-solid fa-calendar-check"></i>
            <span>Plan de estudio</span>
          </a>

          @if(isAdmin) {
            <span class="site-nav-divider" aria-hidden="true"></span>
            <a
              class="site-nav-item site-nav-item-admin"
              [routerLink]="['/admin/examenes']"
              routerLinkActive="site-nav-item-active"
              (click)="closeMobileMenu()">
              <i class="fa-solid fa-table-list"></i>
              <span>Información</span>
            </a>
            <a
              class="site-nav-item site-nav-item-admin"
              [routerLink]="['/admin/reportes']"
              routerLinkActive="site-nav-item-active"
              (click)="closeMobileMenu()">
              <i class="fa-solid fa-ban"></i>
              <span>Reportes</span>
            </a>
            <a
              class="site-nav-item site-nav-item-admin"
              [routerLink]="['/admin/temario']"
              routerLinkActive="site-nav-item-active"
              (click)="closeMobileMenu()">
              <i class="fa-solid fa-book"></i>
              <span>Temario</span>
            </a>
          }

          <a
            class="site-nav-item"
            [routerLink]="['/profile']"
            routerLinkActive="site-nav-item-active"
            (click)="closeMobileMenu()">
            <i class="fa-solid fa-user"></i>
            <span>Perfil</span>
          </a>
        }
      </nav>

      <div class="site-header-actions">
        @if(isNotAuth) {
          <a class="site-auth-link site-auth-link-secondary" [routerLink]="['/login']" (click)="closeMobileMenu()">
            Iniciar sesión
          </a>
          <a class="site-auth-link site-auth-link-primary" [routerLink]="['/register']" (click)="closeMobileMenu()">
            Crear cuenta
            <i class="fa-solid fa-arrow-right"></i>
          </a>
        }

        @if(isAdmin || isUser) {
          <button type="button" class="site-logout-button" (click)="logout()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            Cerrar sesión
          </button>
        }
      </div>
    </div>
  </div>
</header>
